<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/huapass/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Learn Mandarin and pass TOCFL Band A before you go to Taiwan.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HuaPass">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HuaPass 華語通</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Speech unlock: iOS Safari (and some Android browsers) only allow
    // speechSynthesis after it has been triggered inside a user gesture.
    // Speak a silent utterance on the first tap/click to unlock the engine
    // for the app's later programmatic calls. Also warm the async voice list.
    (function () {
      try { window.speechSynthesis && window.speechSynthesis.getVoices(); } catch (e) {}
      function unlock() {
        try {
          var u = new SpeechSynthesisUtterance(' ');
          u.volume = 0; u.rate = 10;
          window.speechSynthesis.speak(u);
        } catch (e) {}
        window.removeEventListener('touchend', unlock, true);
        window.removeEventListener('click', unlock, true);
      }
      window.addEventListener('touchend', unlock, true);
      window.addEventListener('click', unlock, true);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
